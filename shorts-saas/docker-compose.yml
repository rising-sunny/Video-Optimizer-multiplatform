version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shorts
      POSTGRES_USER: shorts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shorts_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorts"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_buffers=256MB
        -c max_connections=20
        -c work_mem=4MB

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shorts:${POSTGRES_PASSWORD:-shorts_secret}@postgres:5432/shorts
      REDIS_URL: redis://redis:6379/0
      APP_MEDIA_DIR: /app/media
      PYTHONPATH: /app:/app/core
    volumes:
      - media_data:/app/media
      - ./backend/app:/app/app
      - ./backend/workers:/app/workers
      - ./backend/core:/app/core
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shorts:${POSTGRES_PASSWORD:-shorts_secret}@postgres:5432/shorts
      REDIS_URL: redis://redis:6379/0
      APP_MEDIA_DIR: /app/media
      PYTHONPATH: /app:/app/core
      WHISPER_MODEL: base
    volumes:
      - media_data:/app/media
      - ./backend/app:/app/app
      - ./backend/workers:/app/workers
      - ./backend/core:/app/core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A workers.celery_app worker
        --loglevel=info
        --concurrency=1
        --max-memory-per-child=1500000
        --max-tasks-per-child=5

volumes:
  postgres_data:
  media_data:
